<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#174B35" />
      <stop offset="100%" stop-color="#123B2B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A35B" />
      <stop offset="100%" stop-color="#E5C77F" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Subtle aesthetic glow rings -->
  <circle cx="720" cy="135" r="225" fill="rgba(197, 163, 91, 0.06)" />
  <circle cx="180" cy="540" r="270" fill="rgba(57, 118, 83, 0.15)" />

  <!-- Center Graphic Card Frame -->
  <rect x="40" y="40" width="820" height="595" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Brand Badge Top Left -->
  <g transform="translate(64, 68)">
    <rect width="260" height="30" rx="15" fill="rgba(197, 163, 91, 0.15)" stroke="url(#goldGrad)" stroke-width="1" />
    <text x="130" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#E5C77F" letter-spacing="1.5" text-anchor="middle">STRICT HYGIENE ASSURANCE</text>
  </g>

  <!-- Center Icon Representation -->
  <g transform="translate(450, 256.5)">
    <circle r="46" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <path d="M0 -22 L18 -14 L18 4 C18 16 0 24 0 24 C0 24 -18 16 -18 4 L-18 -14 Z M-6 2 L-1 7 L8 -3" fill="none" stroke="#E5C77F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography Content -->
  <text x="450" y="391.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Quality & Hygiene Inspection Protocol</text>
  <text x="450" y="438.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E5C77F" text-anchor="middle" letter-spacing="1.2">DAILY PRE-DISPATCH VETERINARY & BIO-SECURITY AUDIT</text>
  <text x="450" y="492.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#CBD5E1" text-anchor="middle">Multi-Stage Temperature Checks • Sanitized Handling Area</text>

  <!-- Quality Assurance Seal Bottom Center -->
  <g transform="translate(450, 600)">
    <rect x="-180" y="-14" width="360" height="28" rx="14" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <circle cx="-160" cy="0" r="4" fill="#34D399" />
    <text x="-148" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#F1F5F9">Food-Grade Chilled Dispatch • 0°C – 4°C Maintained</text>
  </g>
</svg>